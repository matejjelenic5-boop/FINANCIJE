<!DOCTYPE html>
<html lang="hr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#e3ecfb" id="themeColorMeta">
<title>Troškovi</title>
<style>
  :root {
    color-scheme: light;
    --accent: #0A84FF;
    --accent-2: #0669D6;
    --danger: #FF3B30;
    --income: #0B8A5E;
    --vuk: #068C5C;
    --warn: #B8790A;
    --info: #0A6FC2;
    --split: #D6467E;

    --text: #0B0F19;
    --text-2: rgba(60,60,67,0.62);
    --text-3: rgba(60,60,67,0.40);

    --glass: rgba(255,255,255,0.52);
    --glass-brd: rgba(255,255,255,0.62);
    --tile: rgba(255,255,255,0.40);
    --tile-brd: rgba(255,255,255,0.55);
    --tile-solid: rgba(255,255,255,0.88);
    --hi: rgba(255,255,255,0.70);
    --hi-2: rgba(255,255,255,0.60);

    --hair: rgba(11,15,25,0.10);
    --track: rgba(11,15,25,0.08);
    --sh: rgba(11,25,60,0.10);
    --sh-2: rgba(11,25,60,0.22);
    --scrim: rgba(10,16,32,0.42);

    --info-bg: rgba(10,111,194,0.08);
    --info-brd: rgba(10,111,194,0.26);
    --vuk-bg: rgba(6,140,92,0.08);
    --vuk-brd: rgba(6,140,92,0.24);

    --screen-bg:
      radial-gradient(660px 420px at 88% 0%, rgba(10,132,255,0.55), transparent 62%),
      radial-gradient(520px 380px at -12% 18%, rgba(96,165,255,0.60), transparent 66%),
      radial-gradient(480px 400px at 12% 62%, rgba(0,206,201,0.26), transparent 64%),
      radial-gradient(560px 460px at 62% 100%, rgba(233,69,96,0.24), transparent 64%),
      linear-gradient(178deg, #eaf1fe 0%, #cadcf9 46%, #dde8fc 100%);

    --card: var(--tile);
    --surface: var(--tile-solid);
    --border: var(--hair);
    --bg: var(--track);
    --success: var(--income);
    --radius: 18px;
    --font: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', 'Segoe UI', system-ui, sans-serif;
  }

  html[data-theme="dark"] {
    color-scheme: dark;
    --accent: #0A84FF;
    --accent-2: #6FB6FF;
    --danger: #FF453A;
    --income: #30D158;
    --vuk: #34D3A0;
    --warn: #FFB340;
    --info: #64B5FF;
    --split: #FF7AB0;

    --text: #F2F4F8;
    --text-2: rgba(235,235,245,0.72);
    --text-3: rgba(235,235,245,0.50);

    --glass: rgba(255,255,255,0.22);
    --glass-brd: rgba(255,255,255,0.16);
    --tile: rgba(255,255,255,0.12);
    --tile-brd: rgba(255,255,255,0.13);
    --tile-solid: rgba(26,30,42,0.94);
    --hi: rgba(255,255,255,0.15);
    --hi-2: rgba(255,255,255,0.16);

    --hair: rgba(255,255,255,0.14);
    --track: rgba(255,255,255,0.12);
    --sh: rgba(0,0,0,0.45);
    --sh-2: rgba(0,0,0,0.62);
    --scrim: rgba(0,0,0,0.62);

    --info-bg: rgba(100,181,255,0.10);
    --info-brd: rgba(100,181,255,0.26);
    --vuk-bg: rgba(52,211,160,0.10);
    --vuk-brd: rgba(52,211,160,0.26);

    --screen-bg:
      radial-gradient(640px 420px at 88% -2%, rgba(10,132,255,0.52), transparent 62%),
      radial-gradient(520px 400px at -14% 16%, rgba(64,124,255,0.40), transparent 66%),
      radial-gradient(460px 400px at 14% 64%, rgba(0,180,190,0.26), transparent 64%),
      radial-gradient(540px 460px at 66% 102%, rgba(200,50,110,0.30), transparent 64%),
      linear-gradient(178deg, #0d1526 0%, #070b16 48%, #0a1020 100%);
  }

  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html { background: #dde8fc; }
  html[data-theme="dark"] { background: #070b16; }
  body {
    font-family: var(--font);
    color: var(--text);
    min-height: 100vh;
    max-width: 480px;
    margin: 0 auto;
    padding-bottom: 150px;
    position: relative;
  }
  body::before {
    content:''; position: fixed; inset: 0; z-index: -1;
    background: var(--screen-bg);
    background-attachment: fixed;
  }

  /* ── HEADER ─────────────────────────────────── */
  .header {
    position: sticky; top: calc(8px + env(safe-area-inset-top)); z-index: 50;
    margin: calc(8px + env(safe-area-inset-top)) 14px 0;
    padding: 18px 18px 16px;
    border-radius: 26px;
    background: var(--glass);
    -webkit-backdrop-filter: blur(60px) saturate(200%);
    backdrop-filter: blur(60px) saturate(200%);
    border: 0.5px solid var(--glass-brd);
    box-shadow: inset 0 1px 0 var(--hi-2), 0 10px 30px var(--sh);
  }
  .header-top { display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .month-label { font-size:27px; font-weight:700; letter-spacing:-0.6px; }
  .hdr-tools { display:flex; align-items:center; gap:8px; flex-shrink:0; }
  .sync-bar {
    display:flex; align-items:center; gap:6px;
    background: rgba(255,255,255,0.30);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    backdrop-filter: blur(20px) saturate(180%);
    border: 0.5px solid var(--glass-brd);
    border-radius: 999px; padding: 5px 11px 5px 9px;
    font-size: 11.5px; color: var(--text-2);
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  html[data-theme="dark"] .sync-bar { background: rgba(255,255,255,0.10); }
  .sync-dot { width:7px; height:7px; border-radius:50%; background:var(--text-3); flex-shrink:0; }
  .sync-dot.ok { background:#30D158; }
  .sync-dot.err { background: var(--danger); }
  .sync-dot.loading { background:#F5A524; animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

  .theme-btn {
    width:32px; height:32px; border-radius:50%; cursor:pointer;
    background: rgba(255,255,255,0.30);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    backdrop-filter: blur(20px) saturate(180%);
    border: 0.5px solid var(--glass-brd);
    font-size:14px; line-height:1;
    display:flex; align-items:center; justify-content:center;
  }
  html[data-theme="dark"] .theme-btn { background: rgba(255,255,255,0.10); }
  .theme-btn .t-dark { display:none; }
  html[data-theme="dark"] .theme-btn .t-dark { display:inline; }
  html[data-theme="dark"] .theme-btn .t-light { display:none; }

  .header-total { margin-top:12px; display:flex; align-items:flex-end; justify-content:space-between; gap:12px; }
  .total-label { font-size:12px; color:var(--text-2); }
  .total-amount {
    font-size:33px; font-weight:700; letter-spacing:-1.2px; line-height:1.05;
    color: var(--accent); font-variant-numeric: tabular-nums; margin-top:2px;
  }
  .total-amount span { font-size:15px; font-weight:600; color:var(--text-3); letter-spacing:0; }

  .month-nav {
    display:flex; align-items:center; margin-bottom:4px;
    background: rgba(255,255,255,0.30);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    backdrop-filter: blur(20px) saturate(180%);
    border: 0.5px solid var(--glass-brd);
    border-radius: 999px; overflow:hidden;
    box-shadow: inset 0 1px 0 var(--hi-2), 0 3px 10px var(--sh);
  }
  html[data-theme="dark"] .month-nav { background: rgba(255,255,255,0.10); }
  .month-btn {
    border:none; background:none; font-family:var(--font);
    width:38px; height:34px; font-size:17px; color:var(--accent); cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .month-btn:active { opacity:0.5; }
  .nav-sep { width:0.5px; height:18px; background:var(--hair); }

  /* ── PILULE KATEGORIJA ──────────────────────── */
  .summary-scroll { display:flex; gap:8px; overflow-x:auto; padding:12px 14px 4px; scrollbar-width:none; }
  .summary-scroll::-webkit-scrollbar { display:none; }
  .cat-pill {
    flex-shrink:0; text-align:center; cursor:pointer;
    background: rgba(255,255,255,0.32);
    -webkit-backdrop-filter: blur(24px) saturate(190%);
    backdrop-filter: blur(24px) saturate(190%);
    border: 0.5px solid var(--tile-brd);
    border-radius: 20px; padding: 8px 14px;
    box-shadow: inset 0 1px 0 var(--hi), 0 3px 12px var(--sh);
  }
  html[data-theme="dark"] .cat-pill { background: rgba(255,255,255,0.10); }
  .cat-pill.active {
    background: rgba(10,132,255,0.85); border-color: rgba(255,255,255,0.35);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.40), 0 5px 18px rgba(10,132,255,0.40);
  }
  .cat-pill-icon { font-size:16px; display:block; line-height:1.2; }
  .cat-pill-name { font-size:10.5px; color:var(--text-2); display:block; margin-top:1px; }
  .cat-pill-amount { font-size:11.5px; font-weight:600; display:block; margin-top:1px; font-variant-numeric:tabular-nums; }
  .cat-pill.active .cat-pill-name { color:rgba(255,255,255,0.85); }
  .cat-pill.active .cat-pill-amount { color:#fff; }

  /* ── LISTA ──────────────────────────────────── */
  .section-header {
    display:flex; justify-content:space-between; align-items:baseline;
    padding: 20px 22px 7px; font-size:13px;
  }
  .section-header b { font-weight:600; }
  .section-header span { color:var(--text-2); font-variant-numeric:tabular-nums; }
  .day-group { margin: 0 14px; display:flex; flex-direction:column; gap:5px; }
  .expense-item {
    display:flex; align-items:center; gap:12px; padding:11px 14px;
    border-radius: 18px; cursor:pointer;
    background: var(--tile);
    -webkit-backdrop-filter: blur(22px) saturate(190%);
    backdrop-filter: blur(22px) saturate(190%);
    border: 0.5px solid var(--tile-brd);
    box-shadow: inset 0 1px 0 var(--hi), 0 3px 14px var(--sh);
    transition: border-color 0.15s;
  }
  .expense-item.expanded { border-color: var(--danger); }
  .expense-icon {
    width:38px; height:38px; border-radius:11px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-size:18px;
  }
  .expense-info { flex:1; min-width:0; }
  .expense-desc { font-size:15px; font-weight:500; letter-spacing:-0.2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .expense-meta { font-size:12px; color:var(--text-2); margin-top:1px; }
  .expense-right { text-align:right; flex-shrink:0; }
  .expense-amount { font-size:15.5px; font-weight:600; font-variant-numeric:tabular-nums; letter-spacing:-0.3px; }
  .expense-who { font-size:11px; color:var(--text-3); margin-top:1px; }
  .delete-btn {
    display:none; align-items:center; justify-content:center; flex-shrink:0;
    width:32px; height:32px; border-radius:50%; cursor:pointer;
    background: rgba(255,59,48,0.14);
    border: 0.5px solid rgba(255,59,48,0.35);
    color: var(--danger); font-size:14px; font-family:var(--font);
  }
  .expense-item.expanded .delete-btn { display:flex; }

  .empty-state { text-align:center; padding:48px 20px; color:var(--text-2); }
  .empty-icon { font-size:44px; margin-bottom:12px; }
  .empty-text { font-size:15px; line-height:1.5; }

  /* ── FAB + NAVIGACIJA ───────────────────────── */
  .fab {
    position:fixed; left:50%; transform:translateX(-50%);
    bottom: calc(50px + env(safe-area-inset-bottom)); z-index:101;
    width:58px; height:58px; border-radius:50%; cursor:pointer;
    background: rgba(0,113,235,0.94); color:#fff; font-size:30px; font-weight:400;
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    backdrop-filter: blur(20px) saturate(180%);
    border: 0.5px solid rgba(255,255,255,0.70);
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 10px 26px rgba(0,90,200,0.48), inset 0 1px 0 rgba(255,255,255,0.55);
    transition: transform 0.22s ease;
    font-family: var(--font);
  }
  .fab.open { transform: translateX(-50%) rotate(45deg); }
  .fpill {
    position:fixed; bottom: calc(61px + env(safe-area-inset-bottom)); z-index:101;
    height:36px; padding:0 16px; border:none; border-radius:18px; cursor:pointer;
    font-family:var(--font); font-size:14px; font-weight:600; color:#fff;
    display:flex; align-items:center;
    box-shadow: 0 8px 22px var(--sh-2), inset 0 1px 0 rgba(255,255,255,0.30);
    opacity:0; pointer-events:none;
    transition: opacity 0.20s ease, transform 0.24s cubic-bezier(0.34,1.3,0.64,1);
  }
  .fpill.l { right: calc(50% + 34px); background: var(--danger); transform: translateX(26px) scale(0.9); }
  .fpill.r { left:  calc(50% + 34px); background: var(--income); transform: translateX(-26px) scale(0.9); }
  .fpill.show { opacity:1; pointer-events:auto; transform: translateX(0) scale(1); }

  .bottom-nav {
    position:fixed; left:50%; transform:translateX(-50%);
    bottom: calc(20px + env(safe-area-inset-bottom)); z-index:100;
    width: min(452px, calc(100% - 28px));
    display:flex; gap:4px; padding:7px;
    border-radius: 30px;
    background: rgba(255,255,255,0.36);
    -webkit-backdrop-filter: blur(48px) saturate(210%);
    backdrop-filter: blur(48px) saturate(210%);
    border: 0.5px solid var(--glass-brd);
    box-shadow: 0 16px 36px var(--sh-2), inset 0 1px 0 var(--hi);
  }
  html[data-theme="dark"] .bottom-nav { background: rgba(255,255,255,0.10); }
  .nav-item {
    flex:1; border:none; background:none; cursor:pointer; font-family:var(--font);
    display:flex; flex-direction:column; align-items:center; gap:3px;
    padding:8px 0; border-radius:23px; color:var(--text-2); font-size:10.5px; font-weight:500;
  }
  .nav-item.active { background: rgba(10,132,255,0.18); color: var(--accent-2); }
  .nav-item svg { width:21px; height:21px; }
  .nav-gap { width:66px; flex-shrink:0; }

  /* ── MODALI ─────────────────────────────────── */
  .modal-overlay {
    position:fixed; inset:0; z-index:200;
    background: var(--scrim);
    -webkit-backdrop-filter: blur(4px);
    backdrop-filter: blur(4px);
    display:none; align-items:flex-end; justify-content:center;
  }
  .modal-overlay.open { display:flex; }
  .modal {
    width: min(468px, calc(100% - 12px));
    margin: 0 6px calc(6px + env(safe-area-inset-bottom));
    background: var(--tile-solid);
    -webkit-backdrop-filter: blur(40px) saturate(200%);
    backdrop-filter: blur(40px) saturate(200%);
    border: 0.5px solid var(--glass-brd);
    border-radius: 28px;
    padding: 14px 18px 24px;
    max-height: 88vh; overflow-y:auto;
    box-shadow: 0 -10px 50px var(--sh-2), inset 0 1px 0 var(--hi);
    animation: slideUp 0.25s ease;
  }
  @keyframes slideUp { from { transform: translateY(40px); opacity:0; } to { transform: translateY(0); opacity:1; } }
  .modal-handle { width:38px; height:4px; background:var(--hair); border-radius:2px; margin:0 auto 16px; }
  .modal-title { font-size:20px; font-weight:700; margin-bottom:18px; letter-spacing:-0.4px; }

  .form-group { margin-bottom:14px; }
  .form-label { font-size:12px; font-weight:500; color:var(--text-2); margin-bottom:7px; display:block; }
  .form-input {
    width:100%; padding:13px 15px;
    background: var(--tile);
    border: 0.5px solid var(--tile-brd);
    border-radius: 14px;
    color: var(--text); font-size:16px; font-family:var(--font);
    outline:none; transition: border-color 0.15s;
  }
  .form-input:focus { border-color: var(--accent); }
  .form-input::placeholder { color: var(--text-3); }
  .amount-row { display:flex; gap:8px; }
  .amount-row .form-input { flex:1; }
  .currency-badge {
    background: var(--tile); border: 0.5px solid var(--tile-brd);
    border-radius:14px; padding:13px 15px; color:var(--text-2);
    font-size:16px; font-weight:600; display:flex; align-items:center;
  }
  .who-row { display:flex; gap:8px; }
  .who-btn {
    flex:1; padding:12px; cursor:pointer; font-family:var(--font);
    background: var(--tile); border: 0.5px solid var(--tile-brd);
    border-radius:14px; color:var(--text-2); font-size:14px; font-weight:600;
    transition: all 0.15s; text-align:center;
  }
  .who-btn.active { border-color: var(--accent); color:#fff; background: rgba(10,132,255,0.85); }
  .cat-grid { display:grid; grid-template-columns: repeat(4, 1fr); gap:7px; }
  .cat-btn {
    background: var(--tile); border: 0.5px solid var(--tile-brd);
    border-radius:14px; padding:11px 5px; cursor:pointer; text-align:center;
    transition: all 0.15s; font-family:var(--font);
  }
  .cat-btn:active { transform: scale(0.95); }
  .cat-btn.selected { border-color: var(--accent); background: rgba(10,132,255,0.18); }
  .cat-btn-icon { font-size:21px; display:block; margin-bottom:3px; }
  .cat-btn-name { font-size:10px; color:var(--text-2); font-weight:500; line-height:1.2; }
  .cat-btn.selected .cat-btn-name { color: var(--accent-2); }
  .submit-btn {
    width:100%; padding:16px; border:none; border-radius:16px; cursor:pointer;
    background: var(--accent); color:#fff; font-size:16px; font-weight:600;
    font-family:var(--font); margin-top:6px;
    box-shadow: 0 8px 20px rgba(10,132,255,0.35);
    transition: opacity 0.15s, transform 0.1s;
  }
  .submit-btn:active { transform: scale(0.98); opacity:0.9; }
  .submit-btn:disabled { opacity:0.5; }

  /* ── STATISTIKE ─────────────────────────────── */
  .stats-view { padding: 0 14px; }
  .stats-card {
    background: var(--tile);
    -webkit-backdrop-filter: blur(22px) saturate(190%);
    backdrop-filter: blur(22px) saturate(190%);
    border: 0.5px solid var(--tile-brd);
    border-radius: 20px; padding:16px; margin-bottom:10px;
    box-shadow: inset 0 1px 0 var(--hi), 0 3px 14px var(--sh);
  }
  .stats-row { display:flex; justify-content:space-between; align-items:center; margin-bottom:9px; }
  .stats-cat-name { display:flex; align-items:center; gap:8px; font-size:14px; font-weight:500; }
  .stats-amount { font-size:15px; font-weight:600; font-variant-numeric:tabular-nums; }
  .progress-bar { height:6px; background:var(--track); border-radius:3px; overflow:hidden; }
  .progress-fill { height:100%; background: var(--accent); border-radius:3px; transition: width 0.4s ease; }
  .person-split { display:flex; gap:10px; margin-bottom:12px; }
  .split-card {
    flex:1; text-align:center; padding:16px;
    background: var(--tile);
    -webkit-backdrop-filter: blur(22px) saturate(190%);
    backdrop-filter: blur(22px) saturate(190%);
    border: 0.5px solid var(--tile-brd);
    border-radius: 20px;
    box-shadow: inset 0 1px 0 var(--hi), 0 3px 14px var(--sh);
  }
  .split-name { font-size:12px; color:var(--text-2); font-weight:500; }
  .split-amount { font-size:22px; font-weight:700; margin-top:4px; font-variant-numeric:tabular-nums; letter-spacing:-0.5px; }
  .split-pct { font-size:11px; color:var(--text-3); margin-top:2px; }

  /* ── TOAST ──────────────────────────────────── */
  .toast {
    position:fixed; bottom:140px; left:50%; transform:translateX(-50%);
    background: var(--income); color:#fff;
    padding:10px 20px; border-radius:24px;
    font-size:14px; font-weight:600; z-index:999; opacity:0;
    transition: opacity 0.2s; pointer-events:none; white-space:nowrap;
    box-shadow: 0 8px 24px var(--sh-2);
  }
  .toast.show { opacity:1; }

  /* ── ANALIZA ────────────────────────────────── */
  .an-wrap { padding: 14px 14px 0; }
  .an-note { font-size:11px; color:var(--text-2); padding:8px 4px 12px; line-height:1.5; }
  .an-kpi { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:10px; }
  .an-kpi-card, .an-card {
    background: var(--tile);
    -webkit-backdrop-filter: blur(22px) saturate(190%);
    backdrop-filter: blur(22px) saturate(190%);
    border: 0.5px solid var(--tile-brd);
    box-shadow: inset 0 1px 0 var(--hi), 0 3px 14px var(--sh);
  }
  .an-kpi-card { border-radius:18px; padding:14px; }
  .an-card { border-radius:18px; padding:4px 14px; margin-bottom:10px; }
  .an-kpi-l { font-size:10px; font-weight:500; color:var(--text-2); margin-bottom:6px; }
  .an-kpi-v { font-size:20px; font-weight:700; letter-spacing:-0.5px; line-height:1; font-variant-numeric:tabular-nums; }
  .an-kpi-s { font-size:10px; color:var(--text-3); margin-top:4px; }
  .an-sec { font-size:12px; font-weight:600; color:var(--text-2); margin:20px 4px 10px; display:flex; align-items:center; gap:8px; }
  .an-sec::after { content:''; flex:1; height:0.5px; background:var(--hair); }

// ── TEMA ──────────────────────────────────────────────
let theme = 'light';

function iconTint(color) { return color + (theme === 'dark' ? '4d' : '33'); }

function applyTheme(t) {
  theme = (t === 'dark') ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', theme);
  const meta = document.getElementById('themeColorMeta');
  if (meta) meta.setAttribute('content', theme === 'dark' ? '#0a1020' : '#e3ecfb');
  try { localStorage.setItem('tema', theme); } catch(e) {}
}

function toggleTheme() {
  applyTheme(theme === 'dark' ? 'light' : 'dark');
  render();
}

(function initTheme() {
  let saved = null;
  try { saved = localStorage.getItem('tema'); } catch(e) {}
  applyTheme(saved || 'light');

// ── SYNC ──────────────────────────────────────────────
function setSyncStatus(state, text) {
  const dot = document.getElementById('syncDot');
  const txt = document.getElementById('syncText');
  dot.className = 'sync-dot ' + state;
  txt.textContent = text;
}

async function fetchExpenses() {
  try {
    setSyncStatus('loading', 'Sync');
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${encodeURIComponent(TABLE)}?select=*`, {
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': 'Bearer ' + SUPABASE_KEY
      }
    });
    const data = await res.json();
    expenses = data.map(r => ({
      id: String(r.id),
      desc: r.opis || '',
      amount: parseFloat(r.iznos) || 0,
      category: r.kategorija || '',
      who: r.tko || '',
      date: r.datum || ''
    }));
    const now = new Date();
    setSyncStatus('ok', now.toLocaleTimeString('hr-HR', {hour:'2-digit',minute:'2-digit'}));
    render();
  } catch(e) {
    console.error(e);
    setSyncStatus('err', 'Greška');
  }
}

async function pushExpense(expense) {
  const body = JSON.stringify({
    opis: expense.desc,
    iznos: expense.amount,
    kategorija: expense.category,
    tko: expense.who,
    datum: expense.date
  });
  const headers = {
    'apikey': SUPABASE_KEY,
    'Authorization': 'Bearer ' + SUPABASE_KEY,
    'Content-Type': 'application/json',
    'Prefer': 'return=minimal',
    'Resolution': 'ignore-duplicates'
  };
  for (let attempt = 1; attempt <= 3; attempt++) {
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/${encodeURIComponent(TABLE)}`, {
        method: 'POST', headers, body
      });
      if (res.ok) return;
      if (attempt === 3) throw new Error('Insert failed after 3 attempts');
    } catch(e) {
      if (attempt === 3) throw e;
      await new Promise(r => setTimeout(r, 1000 * attempt));
    }
  }
}

async function pushDelete(id) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${encodeURIComponent(TABLE)}?id=eq.${id}`, {
    method: 'DELETE',
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': 'Bearer ' + SUPABASE_KEY
    }
  });
  if (!res.ok) throw new Error('Delete failed');
}

  return expenses.filter(e => {

    return d.getMonth() === currentDate.getMonth() && d.getFullYear() === currentDate.getFullYear();
  });
}

function changeMonth(dir) {
  currentDate = new Date(currentDate.getFullYear(), currentDate.getMonth() + dir, 1);
  filterCat = null;
  render();
}

function getMonthLabel() {
  return MONTHS[currentDate.getMonth()] + ' ' + currentDate.getFullYear();
}

function formatAmt(n) {
  return n.toLocaleString('hr-HR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function catById(id) { return CATEGORIES.find(c => c.id === id) || CATEGORIES[CATEGORIES.length-1]; }

  const monthExp = getMonthExpenses();
  const monthInc = getMonthIncomes();
  const totalExp = monthExp.reduce((s, e) => s + e.amount, 0);

function setFilter(cat) { filterCat = cat; render(); }

function dayLabel(d) {
  const today = new Date(); today.setHours(0,0,0,0);
  const dd = new Date(d); dd.setHours(0,0,0,0);
  const diff = Math.round((today - dd) / 86400000);
  if (diff === 0) return 'Danas';
  if (diff === 1) return 'Jučer';
  return d.toLocaleDateString('hr-HR', { weekday:'short', day:'numeric', month:'long' });
}

function renderList(monthExp) {
  const list = document.getElementById('expenseList');
  let filtered = filterCat ? monthExp.filter(e => e.category === filterCat) : monthExp;
  filtered = [...filtered].sort((a,b) => new Date(b.date) - new Date(a.date));
  if (!filtered.length) {
    list.innerHTML = `<div class="empty-state"><div class="empty-icon">💸</div><div class="empty-text">Nema troškova za ovaj mjesec.<br>Dodaj prvi trošak!</div></div>`;
    return;
  }
  const groups = {};
  filtered.forEach(e => {
    const d = new Date(e.date + 'T00:00:00');
    const key = dayLabel(d);
    if (!groups[key]) groups[key] = [];
    groups[key].push(e);
  });
  let html = '';
  Object.entries(groups).forEach(([date, items]) => {
    const dayTotal = items.reduce((s,e)=>s+e.amount, 0);
    html += `<div class="section-header"><b>${date}</b><span>${formatAmt(dayTotal)} €</span></div><div class="day-group">`;
    items.forEach(e => {
      const cat = catById(e.category);
      html += `<div class="expense-item" id="item-${e.id}" onclick="toggleExpand('${e.id}')">
        <div class="expense-icon" style="background:${iconTint(cat.color)}">${cat.icon}</div>
        <div class="expense-info">
          <div class="expense-desc">${e.desc || cat.name}</div>
          <div class="expense-meta">${cat.name}</div>
        </div>
        <div class="expense-right">
          <div class="expense-amount">${formatAmt(e.amount)} €</div>
          <div class="expense-who">${e.who}</div>
        </div>
        <button class="delete-btn" onclick="deleteExpense(event,'${e.id}')">✕</button>
      </div>`;
    });
    html += `</div>`;
  });
  list.innerHTML = html;
}

function toggleExpand(id) {
  const el = document.getElementById('item-' + id);
  const wasExpanded = el.classList.contains('expanded');
  document.querySelectorAll('.expense-item.expanded').forEach(e => e.classList.remove('expanded'));
  if (!wasExpanded) el.classList.add('expanded');
}

async function deleteExpense(ev, id) {
  ev.stopPropagation();
  if (!confirm('Obrisati ovaj trošak?')) return;
  setSyncStatus('loading', 'Brišem');
  try {
    await pushDelete(id);
    await fetchExpenses();
    showToast('✓ Trošak obrisan');
  } catch(e) {
    setSyncStatus('err', 'Greška');
    showToast('⚠️ Greška pri brisanju');
  }
}

let statsDrillCat = null;

function renderStats(monthExp) {
  const stats = document.getElementById('statsContent');
  if (!monthExp.length) {
    stats.innerHTML = `<div class="empty-state"><div class="empty-icon">📊</div><div class="empty-text">Nema podataka za ovaj mjesec.</div></div>`;
    return;
  }

  if (statsDrillCat) {
    const cat = catById(statsDrillCat);
    const filtered = monthExp.filter(e => e.category === statsDrillCat).sort((a,b) => new Date(b.date) - new Date(a.date));
    const total = filtered.reduce((s,e)=>s+e.amount, 0);
    let html = `<div style="height:12px"></div>`;
    html += `<div style="margin:0 2px 12px;display:flex;align-items:center;gap:10px">
      <button onclick="statsDrillCat=null;render()" style="background:var(--tile);border:0.5px solid var(--tile-brd);border-radius:12px;padding:8px 14px;color:var(--text);font-size:13px;cursor:pointer;font-family:var(--font)">← Natrag</button>
      <span style="font-size:16px;font-weight:600">${cat.icon} ${cat.name} — ${formatAmt(total)} €</span>
    </div>`;
    html += `<div class="stats-card">`;
    if (!filtered.length) {
      html += `<div style="color:var(--text-2);text-align:center;padding:20px">Nema troškova</div>`;
    } else {
      filtered.forEach(e => {
        const d = new Date(e.date + 'T00:00:00');
        const dateStr = d.toLocaleDateString('hr-HR', {day:'numeric', month:'short'});
        html += `<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:0.5px solid var(--hair)">
          <div>
            <div style="font-size:14px;font-weight:500">${e.desc || cat.name}</div>
            <div style="font-size:11px;color:var(--text-3);margin-top:2px">${dateStr} · ${e.who}</div>
          </div>
          <div style="font-size:15px;font-weight:700">${formatAmt(e.amount)} €</div>
        </div>`;
      });
    }
    html += `</div>`;
    stats.innerHTML = html;
    return;
  }

  const total = monthExp.reduce((s,e)=>s+e.amount, 0);
  const matejTotal = monthExp.filter(e=>e.who==='Matej').reduce((s,e)=>s+e.amount,0);
  const martinaTotal = monthExp.filter(e=>e.who==='Martina').reduce((s,e)=>s+e.amount,0);
  const catTotals = {};
  monthExp.forEach(e => { catTotals[e.category] = (catTotals[e.category]||0) + e.amount; });
  const sorted = Object.entries(catTotals).sort((a,b)=>b[1]-a[1]);
  let html = `<div style="height:12px"></div>`;
  html += `<div class="person-split">
    <div class="split-card">
      <div class="split-name">🧔 Matej</div>
      <div class="split-amount" style="color:var(--split)">${formatAmt(matejTotal)} €</div>
      <div class="split-pct">${total ? Math.round(matejTotal/total*100) : 0}% ukupno</div>
    </div>
    <div class="split-card">
      <div class="split-name">👩 Martina</div>
      <div class="split-amount" style="color:var(--split)">${formatAmt(martinaTotal)} €</div>
      <div class="split-pct">${total ? Math.round(martinaTotal/total*100) : 0}% ukupno</div>
    </div>
  </div>`;
  html += `<div class="stats-card">`;
  sorted.forEach(([catId, amt]) => {
    const cat = catById(catId);
    const pct = total ? Math.round(amt/total*100) : 0;
    html += `<div style="margin-bottom:14px;cursor:pointer" onclick="statsDrillCat='${catId}';render()">
      <div class="stats-row">
        <div class="stats-cat-name">${cat.icon} ${cat.name}</div>
        <div style="display:flex;align-items:center;gap:8px">
          <div class="stats-amount">${formatAmt(amt)} €</div>
          <span style="color:var(--text-3);font-size:16px">›</span>
        </div>
      </div>
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%;background:${cat.color}"></div></div>
      <div style="font-size:11px;color:var(--text-3);margin-top:3px">${pct}% ukupnih troškova</div>
    </div>`;
  });
  html += `</div>`;
  stats.innerHTML = html;
}

async function addExpense() {
  const desc = document.getElementById('inputDesc').value.trim();
  const amount = parseFloat(document.getElementById('inputAmount').value);
  const date = document.getElementById('inputDate').value;
  if (!amount || amount <= 0) { showToast('⚠️ Unesi iznos!'); return; }
  if (!selectedCat) { showToast('⚠️ Odaberi kategoriju!'); return; }
  if (!date) { showToast('⚠️ Odaberi datum!'); return; }

  const cat = catById(selectedCat);
  const expense = {
    id: Date.now().toString(),
    desc: desc || cat.name,
    amount,
    category: selectedCat,
    who: selectedWho,
    date
  };

  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = 'Spremanje...';
  setSyncStatus('loading', 'Spremam');

  try {
    await pushExpense(expense);
    closeModal();
    await fetchExpenses();
    showToast('✓ Trošak dodan!');
  } catch(e) {
    btn.disabled = false;
    btn.textContent = 'Dodaj trošak';
    setSyncStatus('err', 'Greška');
    showToast('⚠️ Greška — provjeri internet');
  }
}

function switchView(view) {
  currentView = view;
  document.getElementById('viewTransakcije').classList.toggle('active', view==='Transakcije');
  document.getElementById('viewPrihodi').classList.toggle('active', view==='Prihodi');
  document.getElementById('viewStatistike').classList.toggle('active', view==='Statistike');
  document.getElementById('viewAnaliza').classList.toggle('active', view==='Analiza');
  document.getElementById('navTransakcije').classList.toggle('active', view==='Transakcije');
  document.getElementById('navPrihodi').classList.toggle('active', view==='Prihodi');
  document.getElementById('navStatistike').classList.toggle('active', view==='Statistike');
  document.getElementById('navAnaliza').classList.toggle('active', view==='Analiza');
  render();
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

let selectedIncomeCat = null;
let selectedIncomeWho = 'Matej';

function incCatById(id) { return INCOME_CATEGORIES.find(c => c.id === id) || INCOME_CATEGORIES[INCOME_CATEGORIES.length-1]; }

async function fetchIncomes() {
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/prihodi?select=*`, {
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY }
    });
    const data = await res.json();
    if (Array.isArray(data)) {
      incomes = data.map(r => ({
        id: String(r.id),
        desc: r.opis || '',
        amount: parseFloat(r.iznos) || 0,
        category: r.kategorija || '',
        who: r.tko || '',
        date: r.datum || ''
      }));
    }
  } catch(e) { console.error('Income fetch error:', e); }
}

async function pushIncome(income) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/prihodi`, {
    method: 'POST',
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': 'Bearer ' + SUPABASE_KEY,
      'Content-Type': 'application/json',
      'Prefer': 'return=minimal'
    },
    body: JSON.stringify({
      opis: income.desc,
      iznos: income.amount,
      kategorija: income.category,
      tko: income.who,
      datum: income.date
    })
  });
  if (!res.ok) throw new Error('Insert failed');
}

async function pushDeleteIncome(id) {
  await fetch(`${SUPABASE_URL}/rest/v1/prihodi?id=eq.${id}`, {
    method: 'DELETE',
    headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY }
  });
}
