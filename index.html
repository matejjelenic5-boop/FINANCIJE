<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0e14">
<title>Troškovi - Modern</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0e14;
    --surface: #141824;
    --card: rgba(26, 32, 48, 0.75);
    --border: rgba(255, 255, 255, 0.08);
    --accent: #ff4d6d;
    --accent-glow: rgba(255, 77, 109, 0.25);
    --income: #00e676;
    --income-glow: rgba(0, 230, 118, 0.2);
    --text: #f3f4f8;
    --muted: #8b93a7;
    --radius: 20px;
    --font: 'Plus Jakarta Sans', system-ui, sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    max-width: 480px;
    margin: 0 auto;
    padding-bottom: 90px;
  }

  /* HEADER & HERO CARD */
  .header {
    padding: 32px 20px 16px;
    background: radial-gradient(circle at top right, rgba(0, 230, 118, 0.08), transparent 60%);
  }
  .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .app-title { font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; }
  .sync-badge {
    display: flex; align-items: center; gap: 6px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid var(--border);
    padding: 4px 10px; border-radius: 20px; font-size: 10px; color: var(--muted);
  }
  .sync-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); }
  .sync-dot.ok { background: var(--income); box-shadow: 0 0 8px var(--income); }
  .sync-dot.loading { background: #f7b731; animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

  .hero-card {
    background: linear-gradient(135deg, rgba(255,255,255,0.07) 0%, rgba(255,255,255,0.02) 100%);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: var(--radius);
    padding: 20px;
    box-shadow: 0 12px 32px rgba(0,0,0,0.4);
    position: relative;
    overflow: hidden;
  }
  .hero-label { font-size: 11px; font-weight: 600; color: var(--muted); letter-spacing: 1.5px; text-transform: uppercase; }
  .hero-amount { font-size: 34px; font-weight: 800; color: var(--accent); margin: 6px 0 12px; letter-spacing: -0.5px; }
  .hero-amount span { font-size: 16px; font-weight: 600; color: var(--muted); }

  .month-nav { display: flex; align-items: center; justify-content: space-between; background: rgba(0,0,0,0.2); padding: 4px; border-radius: 12px; }
  .month-btn {
    background: none; border: none; color: var(--text);
    width: 32px; height: 32px; border-radius: 8px; font-size: 16px; cursor: pointer;
  }
  .month-btn:active { background: rgba(255,255,255,0.1); }
  .current-month { font-size: 13px; font-weight: 700; color: var(--text); }

  /* CATEGORY PILLS */
  .summary-scroll { display: flex; gap: 8px; padding: 12px 20px; overflow-x: auto; scrollbar-width: none; }
  .summary-scroll::-webkit-scrollbar { display: none; }
  .cat-pill {
    flex-shrink: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 8px 14px;
    display: flex; align-items: center; gap: 8px;
    cursor: pointer; transition: all 0.2s;
  }
  .cat-pill.active { border-color: var(--accent); background: var(--accent-glow); }
  .cat-pill-amount { font-size: 11px; font-weight: 700; color: var(--text); }

  /* EXPENSE ITEM */
  .section-header { padding: 12px 20px 6px; font-size: 10px; font-weight: 700; color: var(--muted); letter-spacing: 1.5px; text-transform: uppercase; }
  .expense-item {
    margin: 0 16px 8px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 12px 14px;
    display: flex; align-items: center; gap: 12px;
    cursor: pointer; position: relative;
  }
  .expense-icon {
    width: 42px; height: 42px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center; font-size: 18px;
    background: rgba(255,255,255,0.05);
  }
  .expense-desc { font-size: 14px; font-weight: 600; color: var(--text); }
  .expense-meta { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .expense-amount { font-size: 15px; font-weight: 700; text-align: right; }
  .expense-who { font-size: 10px; color: var(--muted); text-align: right; margin-top: 2px; }

  /* FAB & NAV */
  .fab {
    position: fixed; bottom: 85px; right: 20px;
    width: 56px; height: 56px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), #ff758f);
    border: none; color: #fff; font-size: 26px; font-weight: 300;
    box-shadow: 0 8px 24px var(--accent-glow);
    cursor: pointer; z-index: 100;
    display: flex; align-items: center; justify-content: center;
  }
  .bottom-nav {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 480px;
    background: rgba(20, 24, 36, 0.85); backdrop-filter: blur(16px);
    border-top: 1px solid var(--border);
    display: flex; justify-content: space-around; padding: 10px 0 16px; z-index: 99;
  }
  .nav-item { background: none; border: none; color: var(--muted); font-size: 10px; font-weight: 600; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .nav-item.active { color: var(--accent); }
  .nav-item svg { width: 20px; height: 20px; stroke: currentColor; }

  .view { display: none; } .view.active { display: block; }
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div class="app-title">Troškovi</div>
    <div class="sync-badge">
      <div class="sync-dot ok" id="syncDot"></div>
      <span id="syncText">Sinkronizirano</span>
    </div>
  </div>
  
  <div class="hero-card">
    <div class="header-top" style="margin:0">
      <div>
        <div class="hero-label" id="totalLabel">Ukupni Troškovi</div>
        <div class="hero-amount" id="totalAmount">0 <span>EUR</span></div>
      </div>
    </div>
    <div class="month-nav">
      <button class="month-btn" onclick="changeMonth(-1)">‹</button>
      <span class="current-month" id="currentMonth">Lipanj 2026</span>
      <button class="month-btn" onclick="changeMonth(1)">›</button>
    </div>
  </div>
</div>

<div class="summary-scroll" id="catPills"></div>

<div id="viewTransakcije" class="view active">
  <div id="expenseList"></div>
</div>

<div class="fab" id="mainFab">+</div>

<nav class="bottom-nav">
  <button class="nav-item active" id="navTransakcije">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
    Troškovi
  </button>
  <button class="nav-item" id="navPrihodi">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>
    Prihodi
  </button>
  <button class="nav-item" id="navStatistike">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M8 17v-4M12 17v-7M16 17v-2"/></svg>
    Statistike
  </button>
</nav>

</body>
</html>
